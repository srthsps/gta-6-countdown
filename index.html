<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GTA VI Countdown</title>
  <meta name="description" content="Live GTA 6 launch countdown for every country — November 19, 2026.">
  <meta name="theme-color" content="#0d0221">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="sun"></div>
    <svg class="palm palm-l" viewBox="0 0 200 400"><use href="#palm"/></svg>
    <svg class="palm palm-r" viewBox="0 0 200 400"><use href="#palm"/></svg>
    <div class="floor"><div class="lines"></div></div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="palm" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M100 400 C 106 300, 92 200, 110 112" stroke-width="11"/>
        <path d="M110 112 Q 60 78 14 122" stroke-width="9"/>
        <path d="M110 112 Q 66 52 26 48" stroke-width="9"/>
        <path d="M110 112 Q 118 46 86 14" stroke-width="9"/>
        <path d="M110 112 Q 150 54 192 66" stroke-width="9"/>
        <path d="M110 112 Q 164 96 188 152" stroke-width="9"/>
        <path d="M110 112 Q 88 132 58 178" stroke-width="8"/>
      </g>
    </defs>
  </svg>

  <main>
    <section class="hero">
      <p class="date reveal">Nov 19 · 2026</p>
      <h1 class="title reveal">
        <span class="t-gta">Grand Theft Auto</span>
        <span class="t-vi">VI</span>
      </h1>

      <div class="hero-cd reveal" id="heroCd" role="timer">
        <div class="unit"><div class="digits" data-u="d"></div><span>days</span></div>
        <div class="unit"><div class="digits" data-u="h"></div><span>hrs</span></div>
        <div class="unit"><div class="digits" data-u="m"></div><span>min</span></div>
        <div class="unit"><div class="digits" data-u="s"></div><span>sec</span></div>
      </div>
      <button class="live-banner" id="heroLive" type="button" hidden>Out now</button>

      <p class="early" id="heroEarly" hidden></p>

      <div class="where reveal">
        <span class="sync" id="syncDot" role="img"></span>
        <div class="select-wrap"><select id="zonePick" aria-label="Location"></select></div>
      </div>
    </section>

    <section class="panel" aria-label="Global rollout">
      <div class="timeline">
        <div class="tl-track">
          <div class="tl-fill" id="tlFill"></div>
          <div class="tl-now" id="tlNow"></div>
          <div class="tl-dots" id="tlDots"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="world" aria-label="Countries">
      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="search" placeholder="Search" autocomplete="off" aria-label="Search countries">
        </div>
        <div class="chips" id="regionChips" role="group" aria-label="Region">
          <button type="button" data-region="all" class="on">All</button>
          <button type="button" data-region="americas">Americas</button>
          <button type="button" data-region="europe">Europe</button>
          <button type="button" data-region="mea">Africa &amp; ME</button>
          <button type="button" data-region="apac">Asia-Pacific</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer>Fan-made · not affiliated with Rockstar Games</footer>

  <script src="app.js"></script>
</body>
</html>
